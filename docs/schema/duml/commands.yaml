      kind: i16_scaled
      offset: 0
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: V
    - name: roll
      kind: i16_scaled
      offset: 2
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: V
    - name: pitch
      kind: i16_scaled
      offset: 4
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: V
    - name: flags
      kind: packed_u8
      offset: 6
      targets: [python, dart]
