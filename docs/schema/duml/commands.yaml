"0x06/0x22":
  name: RcRequestGimbalCtrPermission
  direction: command
  class_doc: >
    RC RequestGimbalCtrPermission - empty payload. Receiver is DeviceType.osd (14),
    not RC - DJI's own class targets that device type despite the cmdset being named
    RC. Does NOT appear to be a prerequisite for interactive gimbal control - an
    exhaustive call-site search of the real dji.pilot app found this used only for
    the RC master/slave handoff scenario and the third-party Mobile SDK layer, never
    in the app's own single-pilot FPV gimbal UI (which uses GimbalSpeedControl
    instead, with permission embedded in that packet). Consistent with this command
    never getting a reply despite being sent before every
    AngleControl/AbsAngleControl attempt in earlier testing.
  confidence: V
  provenance: >
    dji.pilot decompile, DataRcRequestGimbalCtrPermission.java. Was
    app/awto_dji_app/lib/link/gimbal_commands.dart's `permissionRequest()` and
    scripts/re/duml_commands.py's `RcRequestGimbalCtrPermission`/
    `gimbal.requestCtrPermission`.
  ids:
    - {cmdset: 0x06, cmdid: 0x22, catalog_name: "RC/RequestGimbalCtrPermission"}
  payload_length: 0
  fields: []

