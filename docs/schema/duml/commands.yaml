"0x04/0x0c":
  name: GimbalSpeedControl
  direction: command
  class_doc: >
    Gimbal SpeedControl. THIS is the command the real app actually uses for
    interactive single-pilot gimbal control - confirmed 2026-10-24 against
    dji.pilot's real FPV gimbal UI (DJIFpvGimbalPitchView.java): sent continuously on
    a 40ms timer while a control button is held (permission bit + speed), then one
    final permission-release + zero-speed send on release. An exhaustive call-site
    search of the whole decompiled app found AngleControl/AbsAngleControl/Control/
    RcRequestGimbalCtrPermission used only for RC master/slave handoff and the
    third-party Mobile SDK layer - NOT this app's own gimbal control path.
  confidence: V
  provenance: >
    dji.pilot decompile, DataGimbalSpeedControl.java +
    DJIFpvGimbalPitchView.java. Permission is embedded as bit7 of the flags byte in
    THIS SAME packet - there is no separate request/ack handshake for interactive
    control (RcRequestGimbalCtrPermission, 0x06/0x22, appears to be for the
    master/slave scenario, not this flow - matches it never getting a reply).
    speedDegPerSec scale is I (inferred) - deg/s*10 by analogy with this project's
    existing *10 convention; the UI's own speed constant is a raw 270, not
    independently confirmed as a unit. Was
    app/awto_dji_app/lib/link/gimbal_commands.dart's `speedControl()` and
    scripts/re/duml_commands.py's `GimbalSpeedControl`/`gimbal.speedControl`.
  ids:
    - {cmdset: 0x04, cmdid: 0x0c, catalog_name: "GIMBAL/SpeedControl"}
  payload_length: 7
  fields:
    - name: yaw
      kind: i16_scaled
      offset: 0
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: I
      doc: deg/s, inferred scale.
    - name: roll
      kind: i16_scaled
      offset: 2
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: I
      doc: deg/s, inferred scale.
    - name: pitch
      kind: i16_scaled
      offset: 4
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: I
      doc: deg/s, inferred scale.
    - name: flags
      kind: packed_u8
      offset: 6
      targets: [python, dart]
      confidence: V
      doc: >
        bit7 = permission (1=take control, 0=release). The real app sends this
        continuously while a button is held; for a one-shot test, send a few times
        in a row (no separate permission request needed).
      bits:
        - {name: take_control, dart_name: takeControl, shift: 7, width: 1, default: true, type: bool}

