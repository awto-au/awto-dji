    pitch only) match a real-hardware test (2026-10-24); the app's own un-set default
    is all-axes-valid (every bit 0) - not confirmed our pitch-only default is
    required, only that it is what was tested. Was
    scripts/re/duml_commands.py's `GimbalAbsAngleControl`/`gimbal.absAngle`.
  ids:
    - {cmdset: 0x04, cmdid: 0x14, catalog_name: "GIMBAL/AbsAngleControl"}
  payload_length: 8
  fields:
