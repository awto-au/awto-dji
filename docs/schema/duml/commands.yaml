    answers its own GetVersion request with this layout, identified only by which
    device sent the reply (sender type), not by payload content.
  confidence: V
  provenance: >
    dji.midware.data.model.P3.DataCommonGetVersion (dji.go.v4 decompile). Offsets
    fixed awto-dji#32 (one byte later than this project's original, off-by-one
    port): cross-checked against o-gs/dji-firmware-tools'
    general_version_inquiry_dissector (dji-dumlv1-general.lua:120-160) and two
    real captured GetVersion replies (captures/sessions/2026-10-24/duml_probe.log,
    docs/identity-queries.md:18) - a real RC/GL300C reply decodes hardwareVersion
    cleanly as "GL300C" at these offsets (garbled at the old ones), and an
    unprogrammed device's reply decodes loaderVersion/firmwareVersion to
    "255.255.255.254", matching the SD-card upgrade log's own placeholder pattern
    (docs/firmware-upgrade-log-review.md:62-64). Was
    app/packages/duml/lib/src/version.dart's CommonVersion and
    scripts/re/fw_version_check.py's `decode_common_version`, hand-duplicated in
    both languages - migrated here to stop that. The empty-payload outgoing
    GetVersion *request* (scripts/re/duml_proto.py build_frame callers,
    app/awto_dji_app/lib/link/diagnostics_commands.dart's getVersion()) shares this
    same (cmdset,cmdid) but is a separate, still-hand-written encode path - this
    schema format doesn't yet support one entry being both a push decode and a
    command encode under the same id, so that empty-request side is deliberately
    left unmigrated.
  ids:
    - {cmdset: 0x00, cmdid: 0x01, catalog_name: "COMMON/GetVersion"}
