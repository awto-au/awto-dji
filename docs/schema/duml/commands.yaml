# Canonical, single-file DUML command/field schema (awto-dji#33). One entry per
# command/push, keyed by its DUML code (primary cmdset/cmdid as "0xSS/0xII"), not by
# name - matches how the real wire identifies a command. A command registered under
# more than one (cmdset,cmdid) pair still lists every alias in its own `ids:`; the map
# key is just the first (primary) one.
#
# Generates, per entry: scripts/re/duml_generated/<snake_name>.py,
# app/packages/duml/lib/src/generated/<snake_name>.dart, tests for both (if `tests:`
# is present), and docs/schema/duml/generated/<snake_name>.md. See
# docs/schema/duml/README.md for the field format and regenerate command. Do not
# hand-edit any generated file.
#
# Status: 12 of ~723 known commands (scripts/re/duml_catalog.py) migrated so far -
# migrate incrementally, per the issue's own instruction. Everything else in
# duml_catalog.py is still outside this file. Known still-unmigrated cases, and why:
# - Get*/Set* pairs that share one (cmdset,cmdid) for both an empty-payload outgoing
#   request and a payload-bearing incoming reply (GetVersion 0x00/0x01, GetAELock
#   0x02/0x69, RequestGimbalCtrPermission's reply) - this file only supports one
#   direction per id; the push (reply-decode) side is migrated, the empty-request
#   encode side is left as the existing hand-written Dart command builder.

"0x03/0x43":
  name: OsdGeneral
  direction: push
  class_doc: >
    Flight Controller "OSD General Data" push, the main telemetry message. Same
    class is registered under two cmdset/cmdid pairs in the real app (CmdSet.java):
    FLYC.GetPushCommon(3,0x43) and OSD.GetPushCommon(9,0x01) both resolve to
    dji.midware.data.model.P3.DataOsdGetPushCommon.
  confidence: U  # the push ITSELF: 0x03/0x43 never seen live; 0x09/0x01 confirmed
                 # 34,653x same session (awto-dji#16). Field layout below is V/I per-field.
  provenance: >
    dji.midware.data.model.P3.DataOsdGetPushCommon (dji.go.v4 decompile, gitignored,
    not in this repo). Offsets 0-29 originally from the public o-gs/dji-firmware-tools
    Wireshark dissector; offsets 30-52 are a byte-for-byte port of the real class's
    get(offset,len,...) calls. See awto-dji#16.

  # (cmdset, cmdid) pairs this struct answers under - both must be matched.
  ids:
    - {cmdset: 0x03, cmdid: 0x43, catalog_name: "FLYC/GetPushCommon"}
    - {cmdset: 0x09, cmdid: 0x01, catalog_name: "OSD/GetPushCommon#OSD"}

  # Payload length below this is not an OSD General push at all (matches() gate).
  min_length: 30

  # Target languages this schema currently generates. python only gets fields with
  # "python" in targets (today: just the geometric 9 - duml_telemetry.py's
  # _osd_general_push never ported the rest; see each field's targets below).
  fields:
    - name: longitude
      dart_name: longitude
      kind: f64_rad_to_deg
      offset: 0
      targets: [python, dart]
      confidence: V

    - name: latitude
      kind: f64_rad_to_deg
      offset: 8
      targets: [python, dart]
      confidence: V

    - name: relative_height
      dart_name: relativeHeight
      kind: i16_scaled
      offset: 16
      scale: 10
      targets: [python, dart]
      confidence: V

    - name: vgx
      kind: i16_scaled
      offset: 18
      scale: 10
      targets: [python, dart]
      confidence: V

    - name: vgy
      kind: i16_scaled
      offset: 20
      scale: 10
      targets: [python, dart]
      confidence: V

    - name: vgz
      kind: i16_scaled
      offset: 22
      scale: 10
      targets: [python, dart]
      confidence: V

    - name: pitch
      kind: i16_scaled
      offset: 24
      scale: 10
      targets: [python, dart]
      confidence: V

    - name: roll
      kind: i16_scaled
      offset: 26
      scale: 10
      targets: [python, dart]
      confidence: V

    - name: yaw
      kind: i16_scaled
      offset: 28
      scale: 10
      targets: [python, dart]
      confidence: V

    # --- extended fields: Dart-only so far (not yet ported to the Python side) ---

    - name: flyc_version
      dart_name: flycVersion
      kind: u8
      offset: 47
      min_length: 48
      targets: [dart]
      confidence: V
      doc: >
        getFlycVersion() - FC protocol/firmware generation. Needed to pick the
        motor_failed_cause decode path.

    - name: motor_up
      dart_name: motorUp
      kind: bitfield_u32
      offset: 32
      bit: 3
      min_length: 36
      targets: [dart]
      confidence: V
      doc: isMotorUp() - bit 3 of the flags int32 at offset 32.

    - name: motor_blocked
      dart_name: motorBlocked
      kind: bitfield_u32
      offset: 32
      bit: 27
      min_length: 36
      targets: [dart]
      confidence: V
      doc: isMotorBlock() - arming interlock (props-off/no-arm) engaged.

    - name: compass_error
      dart_name: compassError
      kind: bitfield_u32
      offset: 32
      bit: 16
      min_length: 36
      targets: [dart]
      confidence: V
      doc: getCompassError() - bit 16 of the flags int32.

    - name: imu_preheated
      dart_name: imuPreheated
      kind: bitfield_u32
      offset: 32
      bit: 12
      min_length: 36
      targets: [dart]
      confidence: V
      doc: isImuPreheatd() - bit 12 of the flags int32.

    - name: motor_failed_cause
      dart_name: motorFailedCause
      kind: motor_failed_cause_p3   # branchy - see README "Escape hatch" section
      byte_offset: 38
      flyc_version_field: flyc_version
      alt_byte_offset: 51
      enum_ref: MotorStartFailedCause
      min_length: 39
      targets: [dart]
      confidence: V
      doc: >
        getMotorFailedCause() - why the arming interlock is up, or the live fault.
        Decode path depends on flyc_version (>=26: byte38 direct; else byte38 top
        bit, falling back to byte38&0x7f or byte51 depending on payload length).

    - name: imu_init_fail_reason
      dart_name: imuInitFailReason
      kind: enum_u8
      offset: 49
      enum_ref: ImuInitFailReason
      min_length: 50
      targets: [dart]
      confidence: V
      doc: getIMUinitFailReason() - IMU init/preflight/calibration state.

"0x00/0x0b":
  name: RestartDevice
  direction: command
  class_doc: >
    COMMON RestartDevice. Reboots the target device: after the ack, the device stops
    feeding its own watchdog, which resets the chip after watchdog_ms.
  confidence: V
  provenance: >
    docs/ground-upgrade-path.md "0x0B Reboot Chip" (m1400 handler 0x5124, firmware-side
    decode of the payload layout and the mode-byte error case) + real-hardware
    confirmation 2026-10-24 against the ground RC (USB-serial device re-enumerated, DUML
    sequence counter reset to 0, right when sent). docs/data/apk-dynamic-cmdset-ids.tsv
    confirms cmdset 0x00/cmdid 0x0b is COMMON/RestartDevice generically, not RC-specific.

  ids:
    - {cmdset: 0x00, cmdid: 0x0b, catalog_name: "COMMON/RestartDevice"}

  payload_length: 6

  fields:
    - name: reserved
      kind: u8
      offset: 0
      role: const
      value: 0
      targets: [python, dart]
      confidence: V
      doc: always 0 (m1400 handler 0x5124 byte0, unused by that handler).

    - name: mode
      kind: u8
      offset: 1
      role: param
      default: 1
      valid: [0, 1]
      targets: [python, dart]
      confidence: V
      doc: >
        must be 0 or 1, else the device replies error 0xE3 (m1400 handler 0x5124).
        Meaning of 0 vs 1 beyond "valid" not decoded.

    - name: watchdog_ms
      dart_name: watchdogMs
      kind: u32
      offset: 2
      role: param
      default: 1000
      targets: [python, dart]
      confidence: I
      doc: >
        ms until the stopped watchdog resets the chip. 1000ms confirmed working against
        the ground RC 2026-10-24, not measured as a minimum.

  # Only behavioral tests here, not byte-exact ones - an expect_payload_hex would
  # just be the same offset/value arithmetic above, hand-recomputed (got it wrong
  # twice doing exactly that; see docs/schema/duml/README.md "Tests"). No raw
  # capture of the real 2026-10-24 bench confirmation was kept, so there is no real
  # captured frame to cite either - if one turns up later, cite it as prose (exact
  # bytes + capture log path) in a doc: line, not as a hand-derived hex field.
  tests:
    - name: mode_out_of_range_rejected
      doc: anything but 0/1 must be rejected locally, not sent (device would reply 0xE3).
      params: {mode: 2, watchdog_ms: 1000}
      expect_error: true

"0x04/0x0a":
  name: GimbalAngleControl
  direction: command
  class_doc: >
    Gimbal AngleControl. Source: DataGimbalAngleControl.java, confirmed 2026-10-24
    against real dji.pilot decompile (dynamic/memscan unpack). An exhaustive call-site
    search of the decompiled app found this used only for RC master/slave handoff and
    the third-party Mobile SDK layer - not the app's own interactive FPV gimbal UI,
    which uses GimbalSpeedControl (0x04/0x0c) instead.
  confidence: V
  provenance: >
    dji.pilot decompile (dynamic/memscan unpack, gitignored, not in this repo),
    DataGimbalAngleControl.java. Was app/awto_dji_app/lib/link/gimbal_commands.dart's
    `angle()` and scripts/re/duml_commands.py's `GimbalAngleControl`/`gimbal.angle`,
    hand-duplicated in both languages - migrated here to stop that.
  ids:
    - {cmdset: 0x04, cmdid: 0x0a, catalog_name: "GIMBAL/AngleControl"}
  payload_length: 10
  fields:
    - name: yaw
      kind: i16_scaled
      offset: 0
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: V
      doc: degrees.
    - name: roll
      kind: i16_scaled
      offset: 2
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: V
      doc: degrees.
    - name: pitch
      kind: i16_scaled
      offset: 4
      scale: 10
      role: param
      default: 0.0
      targets: [python, dart]
      confidence: V
      doc: degrees.
    - name: duration
      kind: u16
      offset: 6
      role: param
      default: 300
      targets: [python, dart]
      confidence: V
      doc: ms. APK default 300.
    - name: flags
      kind: u8
      offset: 8
      role: const
      value: 0x24
      targets: [python, dart]
      confidence: V
      doc: >
        opaque: doPack() bit-packs permission/mode flags via a shift chain that
        destroys most of the earlier bits, verified by hand-tracing with all
        class-defaults (permission=False, 3 APK-default-True flags) giving exactly
        0x24. The byte genuinely carries ~1 surviving bit; 0x24 is the only value
        tested.
    - name: overtime
      kind: u8
      offset: 9
      role: param
      default: 10
      targets: [python, dart]
      confidence: V

