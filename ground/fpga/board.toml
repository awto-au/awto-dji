# Ground-side FPGA of a Lightbridge RC.  Lives in awto-dji; run from the pluribus checkout:
#   python3.15t scripts/run_pipeline.py --board <awto-dji>/ground/fpga --label G --workers 8
# No third-party binary is copied here; `bin` points at the firmware tree in this repo.

[board]
name    = "DJI Lightbridge ground FPGA (m2001)"
device  = "5CEBA4U19C8"
package = "U19"
lifter  = "cyclonev"
top     = "dji_p3_ground"

[files]
pins_tsv = "pins.tsv"

# bin    = vendor firmware module (8 MiB flash image, 0xFF padded; payload at 0x20)
# config = Mistral .bt decompile, regenerated by scripts/cyclonev_unpack.py into tmp/ (never overwritten)
[bitstreams.G]
bin    = "../../firmware/unpacked/C1_FW_V01.06.0000/C1_FW_V01.06.0000_m2001.bin"
config = "../../../pluribus/tmp/dji/G.bt"
