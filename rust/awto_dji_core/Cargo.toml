[package]
name = "awto_dji_core"
version = "0.1.0"
edition = "2024"
description = "DJI Cloud API client core (MQTT) with a C ABI for Flutter and other FFI hosts"
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
lto = true
strip = true
